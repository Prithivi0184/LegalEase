services:
  - type: web
    name: legal-ease-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: APP_NAME
        value: LegalEase
      - key: COMPANY_NAME
        value: LegalEase